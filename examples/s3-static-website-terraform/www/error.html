<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Not Found</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0e14;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #131720;
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: 16px;
      padding: 48px 56px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    }

    .code {
      font-size: 96px;
      font-weight: 900;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #ef4444, #f87171);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 16px;
    }

    h1 { font-size: 22px; font-weight: 700; margin-bottom: 12px; color: #f1f5f9; }

    p { font-size: 14px; color: #64748b; line-height: 1.7; margin-bottom: 28px; }

    a {
      display: inline-block;
      background: rgba(0,117,184,0.15);
      border: 1px solid rgba(0,117,184,0.4);
      color: #38bdf8;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 24px;
      border-radius: 8px;
      text-decoration: none;
    }
    a:hover { background: rgba(0,117,184,0.25); }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Something is amiss.</h1>
    <p>The page you're looking for doesn't exist in this S3 bucket.</p>
    <a href="index.html">← Back to home</a>
  </div>
</body>
</html>
